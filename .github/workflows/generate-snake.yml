name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # snk runs in Docker as root; pre-creating dist as the runner user
      # keeps the directory writable for the snapshot step below.
      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: An0myl0u5-Lite
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Snapshot the An0Matr1X profile-report cards. GitHub's camo image
      # proxy allows upstreams only ~4s, which these data-heavy endpoints
      # exceed on cold starts, so they can never render reliably as live
      # embeds. Runners have no such limit: fetch here, validate, and serve
      # the SVGs from the output branch. On any failure the last published
      # copy is kept so the profile never shows a broken image.
      - name: Snapshot An0Matr1X report cards
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for f in profile-report-all.svg; do
            curl -sf --max-time 20 \
              "https://raw.githubusercontent.com/${{ github.repository }}/output/$f" \
              -o "dist/$f" || true
          done
          fetch() {
            if curl -sf --max-time 90 --retry 4 --retry-delay 15 --retry-all-errors \
                 -A "$UA" "$1" -o "$2.tmp" \
               && head -c 300 "$2.tmp" | grep -q '<svg'; then
              mv "$2.tmp" "$2"
              echo "snapshot OK: $2"
            else
              rm -f "$2.tmp"
              echo "::warning::snapshot failed for $2 — keeping last published copy"
            fi
          }
          # mode=all on purpose: selection modes let an account curate away
          # suspect repos. The trust card must cover the full audit universe;
          # the engine's classification buckets separate owned work from
          # forks/reference/archive material.
          fetch "https://project-r28vs.vercel.app/api/profile-report?username=An0myl0u5-Lite&mode=all&include_private=true&include_forks=true&include_archived=true&include_templates=true&include_deprecated=true&include_reference=true&cache_seconds=14400&bg_color=0d1117&border_color=161b22&title_color=39d353&text_color=c9d1d9&accent_color=39d353&warn_color=f78166&custom_title=An0Matr1X%20Security%20%2B%20Profile%20Metrics%20%C2%B7%20All%20Repos" \
            dist/profile-report-all.svg
          # If a card has never been captured, publish a themed placeholder
          # instead of letting the README show a broken image. It is replaced
          # automatically on the first successful snapshot.
          for f in dist/profile-report-all.svg; do
            if [ ! -s "$f" ]; then
              printf '%s' '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="110"><rect width="480" height="110" rx="8" fill="#0d1117" stroke="#161b22"/><text x="24" y="46" font-family="monospace" font-size="14" fill="#39d353">An0Matr1X profile report</text><text x="24" y="72" font-family="monospace" font-size="11" fill="#f78166">engine response pending - auto-refreshes when available</text></svg>' > "$f"
              echo "placeholder written: $f"
            fi
          done

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
